[project]
name = "recipe-api"
version = "1.0.0"
description = "RESTful API для управления рецептами и ингредиентами"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  test:
    name: Tests & Coverage (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing

      - name: Publish Coverage to GitHub Step Summary
        run: |
          echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t recipe_api:ci .

      - name: Run Pytest inside Docker container
        run: |
          docker run --rm recipe_api:ci pytest -v

      - name: Test Docker Compose stack
        run: |
          docker compose up -d --build
          # Wait up to 30s for PostgreSQL and FastAPI to be ready
          timeout 30s bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 1; done'
          # Verify API endpoints
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/docs
          curl -f http://localhost:8000/api/recipes
          docker compose down -v
